<!-- One button per tab; the count is part of its name, "Normandie 33", whatever the visual order; an empty pill waits for it. -->
@for (item of items(); track item.tab) {
  <button
    type="button"
    class="job-tabs__item flex min-w-0 items-center"
    [class.job-tabs__item--active]="item.tab === current()"
    [attr.aria-current]="item.tab === current() ? 'page' : null"
    [attr.aria-label]="item.count === null ? item.label : item.label + ' ' + item.count"
    (click)="selected.emit(item.tab)"
  >
    @if (variant() === 'bar') {
      <!-- Bottom bar: the count takes the glyph's place, over the name. -->
      <span
        class="job-tabs__count flex-none tabular-nums"
        [class.job-tabs__count--pending]="item.count === null"
        >{{ item.count }}</span
      >
      <span class="job-tabs__label min-w-0 truncate">{{ item.label }}</span>
    } @else {
      <!-- Header: glyph, name, then the count. -->
      <app-icon class="job-tabs__icon" [name]="item.icon" />
      <span class="job-tabs__label flex min-w-0 items-center gap-1.5">
        <span class="truncate">{{ item.label }}</span>
        <span
          class="job-tabs__count flex-none tabular-nums"
          [class.job-tabs__count--pending]="item.count === null"
          >{{ item.count }}</span
        >
      </span>
    }
  </button>
}
