<!-- The code names the language in use; the label, which is also the tooltip, names the switch. -->
<button
  app-icon-button
  type="button"
  class="language-toggle__button"
  [attr.aria-label]="accessibleName()"
  [attr.title]="label()"
  (click)="switchLanguage()"
>
  <span class="language-toggle__code">{{ code() }}</span>
</button>
