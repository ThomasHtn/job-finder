<!doctype html>
<!-- Corrected at boot from the reader's browser, or from the language they picked. -->
<html lang="en">
  <head>
    <!-- Encoding, tab title, and the root the router resolves paths against. -->
    <meta charset="utf-8" />
    <title>JobFinder</title>
    <base href="/" />
    <!-- Edge to edge on notched phones; the layout pads itself with the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The app is dark only, so native controls are drawn dark too. -->
    <meta name="color-scheme" content="dark" />
    <!-- Browser chrome tinted to the header, so the status bar runs into it. -->
    <meta name="theme-color" content="#14181c" />
    <!-- Vector tab icon, with the multi-size favicon for browsers that skip SVG. -->
    <link rel="icon" type="image/svg+xml" href="icon.svg" sizes="any" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <!-- iOS ignores SVG here and screenshots the page instead: it needs the raster tile. -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Installable app; `start_url` is the root, whatever page it was added from. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Both typefaces, self-hosted: fetched before the stylesheet asks for them. -->
    <link
      rel="preload"
      href="fonts/nunito-sans/nunito-sans-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/outfit/outfit-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- Icon and wordmark while the app starts; the app fades it out once its first screen shows. -->
    <div class="app-splash" aria-hidden="true">
      <div class="app-splash__body">
        <img class="app-splash__icon" src="icon.svg" alt="" width="72" height="72" />
        <span class="app-splash__name">JobFinder</span>
        <span class="app-splash__bar"></span>
      </div>
    </div>
    <!-- Angular boots the whole app into this element. -->
    <app-root></app-root>
  </body>
</html>
