name: Backend CI

# Pushes to main run it through deliver.yml, which builds the images once both suites pass.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'contract/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.base.js'
      - '.github/workflows/backend-ci.yml'
      # The root format check runs here: the docs, workflows and formatter settings it reads.
      - '*.md'
      - 'docs/**'
      - 'compose.yaml'
      - 'Makefile'
      - 'tools/**'
      - '.github/**'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.editorconfig'

  workflow_dispatch:

  workflow_call:

permissions:
  contents: read

# Superseded pull-request runs are cancelled. Fixed group name: inside deliver.yml, github.workflow is
# the caller's name, and sharing its group would deadlock the call.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Nothing pushes back: no token left on disk for later steps.
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # Same Node as local development: engines.node in package.json.
        with:
          node-version-file: package.json
          cache: npm

      # npm 11, as packageManager says: it only runs the install scripts allowScripts lists.
      - name: Install dependencies
        working-directory: .
        run: npx --yes npm@11.21.1 ci

      # The backend consumes the compiled contract and the generated Prisma client, not their sources.
      - name: Build the contract and the Prisma client
        working-directory: .
        run: |
          npm run build -w @job-finder/contract
          npm run db:generate -w backend

      - name: Check the contract
        working-directory: contract
        run: npm run format:check && npm run lint

      # npm is pinned in several files; they must all match packageManager.
      - name: Check npm pins
        working-directory: .
        run: |
          pin="npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          mismatches=$(grep -rnoE 'npm@[0-9]+\.[0-9]+\.[0-9]+' Makefile backend/Dockerfile frontend/Dockerfile .github/workflows | grep -v ":$pin$" || true)
          if [ -n "$mismatches" ]; then
            echo "These npm pins differ from $pin:"
            echo "$mismatches"
            exit 1
          fi

      # Docs, workflows and compose.yaml at the root. Prettier ignores what git ignores, plus the
      # local excludes of the clone.
      - name: Check root formatting
        working-directory: .
        run: npx prettier --check . --ignore-path .gitignore --ignore-path .prettierignore --ignore-path .git/info/exclude

      - name: Check formatting
        run: npm run format:check

      # Type-aware ESLint, comments on every declaration, import order.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unit tests and the architecture rules; fails below the coverage floors of vitest.config.ts.
      - name: Test
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-report
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build
