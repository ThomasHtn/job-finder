name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; runs on main always finish so every merged
# commit keeps a conclusive status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both apps consume the compiled contract and the generated Prisma client, not their sources.
      - name: Build the shared contract and the Prisma client
        run: npm run build -w @job-finder/shared && npm run db:generate -w api

      - name: Check formatting
        run: npm run format:check

      # ESLint on TypeScript and templates, then Stylelint on stylesheets.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
