<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" role="img" aria-label="The area is a driving-time contour, not an as-the-crow-flies radius">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .bg { fill: #fbfcfd }
    .map { fill: #f1f4f6 }
    .ink { fill: #101822 }
    .ink2 { fill: #545f6d }
    .ink3 { fill: #6c7784 }
    .acc { fill: #0e6e63 }
    .zone { fill: #0e6e63; fill-opacity: .12; stroke: #0e6e63; stroke-opacity: .55; stroke-width: 2 }
    .radius { fill: none; stroke: #6c7784; stroke-width: 2; stroke-dasharray: 9 7 }
    .road { stroke: #101822; stroke-opacity: .12; stroke-width: 5; stroke-linecap: round }
    .pin-out { fill: #6c7784 }
    .hole { fill: #f1f4f6 }
    .halo { paint-order: stroke; stroke: #f1f4f6; stroke-width: 5; stroke-linejoin: round }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1013 }
      .map { fill: #1a1f24 }
      .ink { fill: #e9edf1 }
      .ink2 { fill: #a0aab5 }
      .ink3 { fill: #838e9a }
      .acc { fill: #3fb8a6 }
      .zone { fill: #3fb8a6; fill-opacity: .16; stroke: #3fb8a6; stroke-opacity: .6 }
      .radius { stroke: #838e9a }
      .road { stroke: #ffffff; stroke-opacity: .1 }
      .pin-out { fill: #838e9a }
      .hole { fill: #1a1f24 }
      .halo { stroke: #1a1f24 }
    }
  </style>

