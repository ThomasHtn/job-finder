    <text class="ink" x="96" y="10" font-size="22" font-weight="600" letter-spacing="-.3">45 min drive</text>
    <text class="ink3" x="96" y="38" font-size="18">The real road contour, computed once</text>
    <text class="ink3" x="96" y="62" font-size="18">then checked offer by offer.</text>
  </g>

  <g transform="translate(900 352)">
    <circle class="radius" cx="36" cy="18" r="26" />
    <text class="ink" x="96" y="10" font-size="22" font-weight="600" letter-spacing="-.3">50 km as the crow flies</text>
    <text class="ink3" x="96" y="38" font-size="18">A job board's radius: it ignores</text>
    <text class="ink3" x="96" y="62" font-size="18">the roads, so it gets it wrong twice.</text>
  </g>
