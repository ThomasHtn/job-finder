# Included rather than declared once at server level: nginx drops every inherited
# add_header as soon as a location declares one of its own, so each location that
# sets a header of its own has to pull these back in.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# No includeSubDomains: other subdomains of the VPS may not be on TLS.
add_header Strict-Transport-Security "max-age=31536000" always;
# Angular injects component styles inline, hence 'unsafe-inline' on styles only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
