server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Only the reverse proxy on the host can reach this container (the port is
    # published on the loopback), so its X-Forwarded-For is the one to trust:
    # resolve the real client from it before anything reads $remote_addr.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Baseline hardening; the api adds its own headers through helmet.
    include /etc/nginx/snippets/security-headers.conf;

    # To close public access, uncomment these two lines and mount an htpasswd file
    # (see the deployment section of the README).
    # auth_basic "Job Finder";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        # Overwritten, not appended: the api trusts a single hop, so it must receive
        # exactly one address, the client resolved above, never a spoofed prefix.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An ingestion triggered by hand can take a couple of minutes.
        proxy_read_timeout 300s;
    }

    # Icons and manifest keep their URL across deploys, so a new logo has to be able to land.
    location ~* ^/(favicon\.ico|icon\.svg|icon-[^/]+\.png|apple-touch-icon\.png)$ {
        expires 7d;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 7d;
    }

    # Hashed assets never change, unlike index.html.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
