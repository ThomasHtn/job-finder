<!-- Centred panel with the single password field. -->
<main class="login">
  <div class="login__panel">
    <!-- Decorative mark above the title. -->
    <span class="login__mark" aria-hidden="true"></span>
    <h1 class="login__title">Offres d'emploi</h1>
    <p class="login__lead">Entrez le mot de passe pour ouvrir votre veille.</p>

    <!-- Submit on Enter or on the button. -->
    <form class="login__form" (ngSubmit)="submit()">
      <!-- Password field bound to the signal. -->
      <label class="login__field">
        <span class="login__label u-mono">Mot de passe</span>
        <input
          class="login__input"
          type="password"
          name="password"
          autocomplete="current-password"
          autofocus
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
      </label>

      <!-- Failure message, announced to screen readers. -->
      @if (error(); as message) {
        <p class="login__error" role="alert">
          <app-icon name="alert" />
          <span>{{ message }}</span>
        </p>
      }

      <!-- Disabled while empty or checking. -->
      <button
        class="btn btn--primary login__submit"
        type="submit"
        [disabled]="loading() || !password()"
      >
        {{ loading() ? 'Vérification…' : 'Entrer' }}
      </button>
    </form>
  </div>
</main>
