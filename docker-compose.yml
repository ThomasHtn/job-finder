# Project name: keeps containers, network and volumes namespaced away from any other
# stack already running on the host (Streamlit, etc.).
name: job-finder

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published: only the api reaches it, over the compose network. Uncomment to
    # inspect the database from the host without clashing with a local PostgreSQL.
    # ports:
    #   - '127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Every setting comes from .env; only what differs inside the network is overridden.
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Container-only port, nginx proxies to it; nothing is published on the host.
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8480}
      INGESTION_ON_STARTUP: ${INGESTION_ON_STARTUP:-true}
    # Not published either. Uncomment to hit the api directly from the host.
    # ports:
    #   - '127.0.0.1:${API_HOST_PORT:-3480}:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    # Only port published on the host. Default kept off 80/8080/8501 so it cannot
    # collide with an existing web server or Streamlit app.
    ports:
      - '${HTTP_PORT:-8480}:80'
    depends_on:
      - api

volumes:
  db-data:
